<!-- @dsCard group="Spacing" viewport="700x230" name="Spacing scale" subtitle="4px base. Used for padding, gaps, layout rhythm." -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); padding: 26px; font-family: var(--font-body); }
  .row { display: flex; align-items: center; gap: 14px; padding: 4px 0; }
  .bar { height: 18px; background: var(--gradient-warm); border-radius: var(--radius-xs); }
  .lab { width: 92px; flex: none; font-size: 12px; font-weight: 700; color: var(--color-text); }
  .px { font-size: 11px; color: var(--color-text-muted); font-weight: 600; }
</style>
</head>
<body>
  <div class="row"><span class="lab">space-1</span><span class="bar" style="width:4px"></span><span class="px">4px</span></div>
  <div class="row"><span class="lab">space-2</span><span class="bar" style="width:8px"></span><span class="px">8px</span></div>
  <div class="row"><span class="lab">space-3</span><span class="bar" style="width:12px"></span><span class="px">12px</span></div>
  <div class="row"><span class="lab">space-4</span><span class="bar" style="width:16px"></span><span class="px">16px</span></div>
  <div class="row"><span class="lab">space-6</span><span class="bar" style="width:24px"></span><span class="px">24px</span></div>
  <div class="row"><span class="lab">space-8</span><span class="bar" style="width:32px"></span><span class="px">32px</span></div>
  <div class="row"><span class="lab">space-12</span><span class="bar" style="width:48px"></span><span class="px">48px</span></div>
  <div class="row"><span class="lab">space-16</span><span class="bar" style="width:64px"></span><span class="px">64px</span></div>
  <div class="row"><span class="lab">space-24</span><span class="bar" style="width:96px"></span><span class="px">96px</span></div>
</body>
</html>
