<!-- @dsCard group="Colors" viewport="700x190" name="Signature gradient" subtitle="Подпись бренда — фуксия → малиновый → синий → бирюза" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); padding: 24px; font-family: var(--font-body); }
  .bar { height: 92px; border-radius: var(--radius-lg); background: var(--gradient-sun); box-shadow: var(--shadow-md); }
  .row { display: flex; align-items: baseline; gap: 16px; margin-top: 16px; }
  .word { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; }
  .code { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); font-weight: 700; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="row">
    <span class="word cs-gradient-text">Краски</span>
    <span class="code">--gradient-sun · linear-gradient(135deg, #EE4A9B → #D62E83 → #1F6FBE → #0E9BB0)</span>
  </div>
</body>
</html>
