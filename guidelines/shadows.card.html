<!-- @dsCard group="Spacing" viewport="700x260" name="Shadows & glows" subtitle="Soft warm drops for depth + coloured glows under CTAs and playful tiles." -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-bg); padding: 30px; font-family: var(--font-body); }
  h4 { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--color-text-muted); margin: 0 0 16px; }
  .grid { display: flex; gap: 22px; flex-wrap: wrap; }
  .card { width: 120px; height: 78px; background: var(--paper); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--color-text-muted); }
  .glow { color: #fff; }
</style>
</head>
<body>
  <h4>Neutral drops</h4>
  <div class="grid">
    <div class="card" style="box-shadow:var(--shadow-xs)">xs</div>
    <div class="card" style="box-shadow:var(--shadow-sm)">sm</div>
    <div class="card" style="box-shadow:var(--shadow-md)">md ·cards</div>
    <div class="card" style="box-shadow:var(--shadow-lg)">lg</div>
    <div class="card" style="box-shadow:var(--shadow-xl)">xl</div>
  </div>
  <h4 style="margin-top:26px">Coloured glows</h4>
  <div class="grid">
    <div class="card glow" style="background:var(--pink-400);box-shadow:var(--shadow-pink)">pink</div>
    <div class="card glow" style="background:var(--orange-400);box-shadow:var(--shadow-orange)">orange</div>
    <div class="card glow" style="background:var(--yellow-400);color:var(--ink-900);box-shadow:var(--shadow-yellow)">yellow</div>
    <div class="card glow" style="background:var(--purple-400);box-shadow:var(--shadow-purple)">purple</div>
  </div>
</body>
</html>
