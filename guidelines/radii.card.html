<!-- @dsCard group="Spacing" viewport="700x190" name="Corner radii" subtitle="Generously rounded. Buttons & chips are full pills." -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); padding: 26px; font-family: var(--font-body); }
  .grid { display: flex; gap: 16px; align-items: flex-end; }
  .box { width: 86px; height: 86px; background: var(--pink-100); border: 2px solid var(--pink-300); }
  .name { font-size: 11px; font-weight: 700; color: var(--color-text); margin-top: 8px; text-align: center; }
  .px { font-size: 10px; color: var(--color-text-muted); font-weight: 600; text-align: center; }
  .pill { width: 120px; height: 52px; border-radius: var(--radius-pill); background: var(--gradient-pink); }
</style>
</head>
<body>
  <div class="grid">
    <div><div class="box" style="border-radius:var(--radius-sm)"></div><div class="name">sm</div><div class="px">12px</div></div>
    <div><div class="box" style="border-radius:var(--radius-md)"></div><div class="name">md</div><div class="px">18px</div></div>
    <div><div class="box" style="border-radius:var(--radius-lg)"></div><div class="name">lg ·cards</div><div class="px">28px</div></div>
    <div><div class="box" style="border-radius:var(--radius-xl)"></div><div class="name">xl</div><div class="px">40px</div></div>
    <div><div class="pill"></div><div class="name">pill ·buttons</div><div class="px">999px</div></div>
  </div>
</body>
</html>
