<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); padding: 28px; font-family: var(--font-body); color: var(--color-text); }
  .lead { font-size: 19px; line-height: 1.6; max-width: 600px; font-weight: 400; }
  .row { display: flex; gap: 28px; margin-top: 16px; }
  .w { font-size: 17px; }
  .w b { display:block; font-size: 11px; color: var(--color-text-muted); font-weight: 800; text-transform: uppercase; letter-spacing:.06em; margin-bottom: 2px; }
  .r { font-weight: 400; } .s { font-weight: 600; } .bd { font-weight: 700; }
</style>
</head>
<body>
  <p class="lead">Мы рады поприветствовать вас в нашем садике. Принимаем детей от 1&nbsp;до&nbsp;7&nbsp;лет: пятиразовое питание, забота и ежедневный отчёт в&nbsp;Telegram. ✨</p>
  <div class="row">
    <div class="w"><b>Regular 400</b><span class="r">Тёплая атмосфера</span></div>
    <div class="w"><b>SemiBold 600</b><span class="s">Развивающие игры</span></div>
    <div class="w"><b>Bold 700</b><span class="bd">Записаться сейчас</span></div>
  </div>
</body>
</html>
