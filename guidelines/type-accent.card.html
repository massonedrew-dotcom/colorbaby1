<!-- @dsCard group="Type" viewport="700x200" name="Gradient text & Riffic accent" subtitle="Sun-gradient headline treatment + the Latin-only Riffic lockup." -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); padding: 28px; font-family: var(--font-body); }
  .grad { font-family: var(--font-display); font-weight: 800; font-size: 52px; line-height: 1; }
  .riffic { font-family: var(--font-accent); font-size: 30px; color: var(--color-accent); margin-top: 18px; }
  .note { font-size: 12px; color: var(--color-text-muted); font-weight: 700; margin-top: 6px; }
</style>
</head>
<body>
  <div class="grad cs-gradient-text">Color Baby House</div>
  <div class="riffic">by Color Baby House</div>
  <div class="note">Riffic = --font-accent · Latin only (no Cyrillic) · reserve for the sub-brand lockup</div>
</body>
</html>
