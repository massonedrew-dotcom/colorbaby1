<!-- @dsCard group="Type" viewport="700x230" name="Display — Rubik" subtitle="Chunky rounded sans for headings & the wordmark voice. 700 / 800." -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); padding: 28px; font-family: var(--font-body); }
  .big { font-family: var(--font-display); font-weight: 800; font-size: 58px; line-height: 1; letter-spacing: -.015em; color: var(--color-text); }
  .alpha { font-family: var(--font-display); font-weight: 700; font-size: 26px; color: var(--color-text); margin-top: 14px; letter-spacing: .01em; }
  .meta { font-size: 12px; color: var(--color-text-muted); font-weight: 700; margin-top: 14px; display:flex; gap:18px; }
</style>
</head>
<body>
  <div class="big">Детство в ярких красках</div>
  <div class="alpha">АБВГДЕ ЖЗИКЛМ · абвгде жзиклм · 0123456789</div>
  <div class="meta"><span>--font-display</span><span>weights 700 · 800</span><span>tracking −0.015em</span></div>
</body>
</html>
