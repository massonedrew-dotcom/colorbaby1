<!-- @dsCard group="Type" viewport="700x360" name="Type scale" subtitle="Hero → caption. Rubik for headings, Nunito for text." -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); padding: 26px; font-family: var(--font-body); color: var(--color-text); }
  .r { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .r:last-child { border-bottom: none; }
  .tag { width: 116px; flex: none; font-size: 11px; color: var(--color-text-muted); font-weight: 700; }
  .d { font-family: var(--font-display); font-weight: 800; line-height: 1.05; }
  .b { font-family: var(--font-body); }
</style>
</head>
<body>
  <div class="r"><span class="tag">hero · 84/800</span><span class="d" style="font-size:46px">Краски</span></div>
  <div class="r"><span class="tag">h1 · 64/800</span><span class="d" style="font-size:40px">Наш садик</span></div>
  <div class="r"><span class="tag">h2 · 48/700</span><span class="d" style="font-size:32px; font-weight:700">Занятия и забота</span></div>
  <div class="r"><span class="tag">h3 · 36/700</span><span class="d" style="font-size:26px; font-weight:700">Развивающие игры</span></div>
  <div class="r"><span class="tag">lead · 18/400</span><span class="b" style="font-size:18px">Тёплая атмосфера для малышей</span></div>
  <div class="r"><span class="tag">body · 16/400</span><span class="b" style="font-size:16px">Пятиразовое питание и ежедневный отчёт</span></div>
  <div class="r"><span class="tag">caption · 14/600</span><span class="b" style="font-size:14px; font-weight:600; color:var(--color-text-muted)">от 1 до 7 лет</span></div>
  <div class="r"><span class="tag">overline · 12/800</span><span class="b" style="font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:var(--color-primary)">Запись открыта</span></div>
</body>
</html>
