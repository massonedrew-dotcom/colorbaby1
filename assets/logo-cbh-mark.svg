<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Color Baby House">
  <title>Color Baby House</title>
  <!-- =====
       Знак Color Baby House: кольцо из разноцветных мазков, внутри —
       девочка и мальчик с жёлтым шариком, снизу их держат ладони.
       Вектор, а не PNG: знак стоит в шапке, в favicon и на служебных
       страницах, и в каждом размере должен быть резким. Цвета — те же
       переменные, что в tokens/colors.css, вписаны значениями, чтобы
       файл работал и как отдельная картинка (в <img> CSS не доезжает).
       ===== -->
  <g fill="none" stroke-linecap="round">
    <!-- Кольцо мазков: фуксия → жёлтый → синий → бирюза → фуксия -->
    <g stroke-width="13">
      <path d="M30.3 92.4 A104 104 0 0 1 146.1 25.6" stroke="#EE4A9B"/>
      <path d="M163.6 30.3 A104 104 0 0 1 225.7 92.4" stroke="#FBD130"/>
      <path d="M230.4 109.9 A104 104 0 0 1 180 218.1" stroke="#10559B"/>
      <path d="M163.6 225.7 A104 104 0 0 1 37.9 180"  stroke="#22BFD1"/>
      <path d="M30.3 163.6 A104 104 0 0 1 25.6 146.1" stroke="#EE4A9B"/>
    </g>
    <!-- Отдельные штрихи снаружи — «незакрашенность» ручного мазка -->
    <g stroke-width="9">
      <path d="M100 24.7 L95.4 6.3"    stroke="#FBD130"/>
      <path d="M200.3 47.7 L212.3 34.4" stroke="#EE4A9B"/>
      <path d="M225.9 173.6 L242.2 181.2" stroke="#22BFD1"/>
      <path d="M77.3 223.4 L68.8 239.2" stroke="#10559B"/>
      <path d="M21 143 L3.2 145.5"      stroke="#EE4A9B"/>
    </g>
  </g>

  <!-- Шарик: он между детьми, поэтому рисуется первым -->
  <path d="M128 95 L128 120" stroke="#FBD130" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <ellipse cx="128" cy="82" rx="9.5" ry="11.5" fill="#FBD130"/>
  <path d="M124.6 93.2 L131.4 93.2 L128 97 Z" fill="#FBD130"/>

  <!-- Девочка -->
  <g fill="#EE4A9B">
    <!-- хвостики -->
    <path d="M85.5 62.5 c-6-3.5-11-2.5-13 1.5 c4.5 1 8 2.5 11 5 Z"/>
    <path d="M114.5 62.5 c6-3.5 11-2.5 13 1.5 c-4.5 1-8 2.5-11 5 Z"/>
    <circle cx="82" cy="66" r="4.2"/>
    <circle cx="118" cy="66" r="4.2"/>
    <circle cx="100" cy="70" r="13.2"/>
  </g>
  <!-- платье -->
  <path d="M91 84 h18 c7 0 10 26 12 46 h-42 c2-20 5-46 12-46 Z" fill="#F9C6DC"/>
  <!-- руки: правая тянется к шарику -->
  <path d="M91.5 88 C84 96 80 108 80.5 120" stroke="#F9C6DC" stroke-width="6.4" stroke-linecap="round" fill="none"/>
  <path d="M108.5 88 C116 96 121 106 125 114" stroke="#F9C6DC" stroke-width="6.4" stroke-linecap="round" fill="none"/>
  <!-- ноги и туфельки -->
  <g stroke="#F9C6DC" stroke-width="6.6" stroke-linecap="round" fill="none">
    <path d="M94 130 L93 146"/>
    <path d="M106 130 L107 146"/>
  </g>
  <g fill="#EE4A9B">
    <rect x="86.5" y="145" width="14" height="7.5" rx="3.7"/>
    <rect x="99.5" y="145" width="14" height="7.5" rx="3.7"/>
  </g>

  <!-- Мальчик -->
  <g fill="#1F6FBE">
    <!-- кудри -->
    <circle cx="147" cy="60" r="6"/>
    <circle cx="156" cy="56" r="6.6"/>
    <circle cx="165" cy="60" r="6"/>
    <circle cx="156" cy="70" r="13.2"/>
  </g>
  <!-- футболка и шорты -->
  <path d="M147 84 h18 c4 0 6 3 6 7 v20 h-30 V91 c0-4 2-7 6-7 Z" fill="#1F6FBE"/>
  <path d="M141 111 h30 v19 h-11.5 v-11 h-7 v11 H141 Z" fill="#1F6FBE"/>
  <!-- руки: левая тянется к шарику -->
  <path d="M147.5 88 C140 96 134 106 131 114" stroke="#1F6FBE" stroke-width="6.4" stroke-linecap="round" fill="none"/>
  <path d="M164.5 88 C172 96 176 108 175.5 120" stroke="#1F6FBE" stroke-width="6.4" stroke-linecap="round" fill="none"/>
  <!-- ноги и кроссовки -->
  <g stroke="#1F6FBE" stroke-width="6.6" stroke-linecap="round" fill="none">
    <path d="M149 130 L148.5 146"/>
    <path d="M163 130 L163.5 146"/>
  </g>
  <g fill="#1F6FBE">
    <rect x="142" y="145" width="14" height="7.5" rx="3.7"/>
    <rect x="156" y="145" width="14" height="7.5" rx="3.7"/>
  </g>

  <!-- Ладони: держат детей снизу -->
  <g fill="#EE4A9B">
    <path d="M127 200 C103 199 82 183 74 157 c-3-9 6-12 12-5 c14 16 27 28 41 34 Z"/>
    <path d="M129 200 C153 199 174 183 182 157 c3-9-6-12-12-5 c-14 16-27 28-41 34 Z"/>
  </g>
  <!-- пальцы: светлые линии внутри ладоней -->
  <g stroke="#F9C6DC" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M86 158 C96 172 108 182 120 188"/>
    <path d="M170 158 C160 172 148 182 136 188"/>
  </g>
</svg>
