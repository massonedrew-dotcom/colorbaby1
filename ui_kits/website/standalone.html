<!DOCTYPE html>
<!-- ============================================================================
     Легаси-адрес главной страницы.
     Раньше сайт открывался именно отсюда, поэтому ссылка могла остаться в
     закладках, чатах и поисковом индексе. Настоящая главная теперь в корне —
     /index.html, а эта страница:
       • помечена noindex (иначе в поиске были бы два одинаковых сайта);
       • указывает canonical на корень;
       • на сервере отдаёт 301 на «/» (см. .htaccess / nginx.conf.example).
     Оставлена рабочей, чтобы превью дизайн-системы открывалось локально.
     data-asset-base="../../" — страница лежит на два уровня глубже корня.
     ============================================================================ -->
<html lang="ru" data-asset-base="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://colorbabyhouse.uz/">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Color Baby House — превью главной страницы</title>

<link rel="icon" href="../../favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="../../tokens/fonts.css">

<script defer src="dist/Common.js"></script>

<script defer src="dist/Widgets.js"></script>
<script defer src="dist/App.js"></script>

<style>
  html, body { margin: 0; background: var(--cream); }
  body { font-family: var(--font-body); color: var(--color-text); }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // Те же эффекты прокрутки, что и на главной (index.html).
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var REVEAL_SEL = '.cs-reveal, .cs-reveal-left, .cs-reveal-right, .cs-reveal-zoom, .cs-stagger';
  var revealObserver = null;

  function setupReveal() {
    var els = document.querySelectorAll(REVEAL_SEL.split(', ').map(function (s) { return s + ':not(.is-visible)'; }).join(', '));
    if (REDUCED || !('IntersectionObserver' in window)) {
      els.forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }
    if (!revealObserver) {
      revealObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('is-visible'); revealObserver.unobserve(e.target); }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    }
    els.forEach(function (el) { revealObserver.observe(el); });
  }

  function revealFallback() {
    document.querySelectorAll(REVEAL_SEL.split(', ').map(function (s) { return s + ':not(.is-visible)'; }).join(', '))
      .forEach(function (el) {
        var r = el.getBoundingClientRect();
        if (r.top < window.innerHeight && r.bottom > 0) el.classList.add('is-visible');
      });
  }

  var countObserver = null;
  function setupCounters() {
    var els = document.querySelectorAll('[data-cs-count]:not([data-cs-counted])');
    var run = function (el) {
      el.setAttribute('data-cs-counted', '1');
      var to = parseFloat(el.getAttribute('data-cs-count')) || 0;
      var prefix = el.getAttribute('data-cs-prefix') || '';
      var suffix = el.getAttribute('data-cs-suffix') || '';
      if (REDUCED) { el.textContent = prefix + to + suffix; return; }
      var dur = 1200, t0 = performance.now();
      var step = function (now) {
        var p = Math.min(1, (now - t0) / dur);
        var eased = 1 - Math.pow(1 - p, 3);
        el.textContent = prefix + Math.round(to * eased) + suffix;
        if (p < 1) requestAnimationFrame(step);
      };
      el.textContent = prefix + '0' + suffix;
      requestAnimationFrame(step);
    };
    if (!('IntersectionObserver' in window)) { els.forEach(run); return; }
    if (!countObserver) {
      countObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { countObserver.unobserve(e.target); run(e.target); }
        });
      }, { threshold: 0.6 });
    }
    els.forEach(function (el) { countObserver.observe(el); });
  }

  function setupScrollFx() {
    var bar = document.createElement('div');
    bar.className = 'cs-progress';
    document.body.appendChild(bar);
    var ticking = false;
    var apply = function () {
      ticking = false;
      var y = window.scrollY || document.documentElement.scrollTop;
      var max = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.setProperty('--cs-progress', max > 0 ? Math.min(1, y / max) : 0);
      var header = document.querySelector('.cs-header');
      if (header) header.classList.toggle('is-stuck', y > 12);
      if (!REDUCED) {
        document.querySelectorAll('.cs-parallax').forEach(function (el) {
          var speed = parseFloat(el.getAttribute('data-cs-speed')) || 0.08;
          el.style.setProperty('--cs-py', (-y * speed).toFixed(1) + 'px');
        });
      }
    };
    var onScroll = function () { if (ticking) return; ticking = true; requestAnimationFrame(apply); };
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    apply();
  }

  function mount() {
    var ns = window.DesignSystem_52b7c1;
    if (!ns || !window.App) { setTimeout(mount, 60); return; }
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.App));
    var refresh = function () { window.lucide && window.lucide.createIcons(); setupReveal(); setupCounters(); };
    refresh();
    setupScrollFx();
    setTimeout(revealFallback, 2500);
    window.addEventListener('scroll', revealFallback, { passive: true, once: true });
    var t;
    var obs = new MutationObserver(function () { clearTimeout(t); t = setTimeout(refresh, 30); });
    obs.observe(document.getElementById('root'), { childList: true, subtree: true });
  }
  mount();
</script>
</body>
</html>
