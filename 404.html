  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(255, 77, 151, .28); }
  .btn-main { background: var(--gradient-pink, linear-gradient(90deg, #EE4A9B, #22BFD1)); color: #fff; }
